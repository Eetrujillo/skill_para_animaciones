<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>07 · Magnetic Cursor — extravagant-web-motion</title>
<!--
  MOTION INVENTORY — pattern 07 (magnetic cursor)
  element        | trigger      | property              | duration        | easing
  ----------------|--------------|-----------------------|-----------------|--------------------
  .cursor-dot    | pointermove  | x, y (quickTo lerp)   | 0.12s follow    | power3
  .cursor-ring   | pointermove  | x, y (quickTo lerp)   | 0.4s follow     | power3
  .cursor-ring   | hover target | scale 1 → 2.2         | 300ms           | expo.out
  [data-magnetic]| pointermove  | x, y (capped offset)  | 400ms release   | expo.out
  .tile-inner    | hover        | scale, x, y           | 600ms / release | expo.out
  TIER 3 — pointer-led interaction. One pointermove listener; geometry is cached on pointerenter and
  invalidated on scroll/resize, never read inside the move handler.
  DEGRADATION — fine pointer only: `(hover:hover) and (pointer:fine)`. Reduced motion: native cursor, no
  magnetism. Keyboard: the custom cursor is irrelevant, `:focus-visible` stays visible on every target.
-->
<style>
  :root{
    --bg:#0a0a0b; --surface:#141416; --fg:#f5f3ef; --dim:#8b8b87; --line:#26262a;
    --accent:#d7ff3e;
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease-in:cubic-bezier(.33,0,.2,1);
    --dur-micro:200ms; --dur-enter:600ms; --dur-hero:1000ms;
    --gutter:clamp(20px,4vw,64px);
    --font-display:Georgia,"Times New Roman",serif;
    --font-sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--fg); font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  h1,h2,p{margin:0}
  .label{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--dim);
  }

  .shell{padding:var(--gutter); display:grid; gap:clamp(24px,5vh,56px); min-height:100svh; align-content:start}
  .top{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:baseline}
  h1{
    font-family:var(--font-display); font-weight:400;
    font-size:clamp(2.2rem,7vw,5.4rem); line-height:.98; letter-spacing:-.02em; max-width:22ch;
  }
  h1 em{font-style:italic; color:var(--accent)}

  .actions{display:flex; gap:12px; flex-wrap:wrap; padding-block:8px}
  a.button{
    display:inline-flex; align-items:center; gap:10px;
    border:1px solid var(--line); border-radius:2px; padding:14px 20px;
    text-decoration:none; color:var(--fg);
    font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    transition:border-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out);
    will-change:transform;
  }
  a.button:hover,a.button:focus-visible{border-color:var(--accent); color:var(--accent); outline:none}
  a.button:focus-visible{outline:1px solid var(--accent); outline-offset:3px}

  .grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
  .tile{
    position:relative; overflow:hidden; aspect-ratio:4/3;
    border:1px solid var(--line); background:var(--surface);
    display:block; text-decoration:none; color:var(--fg);
  }
  .tile-inner{
    position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between;
    padding:16px; will-change:transform;
  }
  .tile[data-tone="a"] .tile-inner{background:linear-gradient(150deg,#101012,#1d2410)}
  .tile[data-tone="b"] .tile-inner{background:linear-gradient(150deg,#101012,#241018)}
  .tile[data-tone="c"] .tile-inner{background:linear-gradient(150deg,#101012,#101a24)}
  .tile[data-tone="d"] .tile-inner{background:linear-gradient(150deg,#101012,#221a0c)}
  .tile .name{font-family:var(--font-display); font-size:clamp(1.2rem,2.2vw,1.8rem); line-height:1}
  .tile:focus-visible{outline:1px solid var(--accent); outline-offset:2px}
  .tile .glyph{
    position:absolute; right:-.05em; bottom:-.3em; pointer-events:none;
    font-family:var(--font-display); font-size:min(26vw,220px); line-height:.8; color:rgba(245,243,239,.05);
  }

  footer{
    display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
    border-top:1px solid var(--line); padding-top:18px;
  }

  /* ---------- custom cursor ---------- */
  .cursor-dot,.cursor-ring{
    position:fixed; top:0; left:0; z-index:99; pointer-events:none;
    border-radius:50%; opacity:0;
    will-change:transform;
  }
  .cursor-dot{
    width:6px; height:6px; margin:-3px 0 0 -3px; background:var(--accent);
    transition:opacity var(--dur-micro) linear;
  }
  .cursor-ring{
    width:34px; height:34px; margin:-17px 0 0 -17px;
    border:1px solid rgba(215,255,62,.5);
    display:grid; place-items:center;
    transition:opacity var(--dur-micro) linear, border-color var(--dur-micro) var(--ease-out);
  }
  .cursor-ring span{
    font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--accent); opacity:0; transition:opacity var(--dur-micro) var(--ease-out);
  }
  html.has-cursor.is-over-target .cursor-ring span{opacity:1}
  html.has-cursor .cursor-dot,html.has-cursor .cursor-ring{opacity:1}
  html.has-cursor,html.has-cursor *{cursor:none}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms !important; animation-duration:.01ms !important}
    .cursor-dot,.cursor-ring{display:none}
  }
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <span class="label">Halcyon Studio</span>
    <span class="label">Magnetic cursor / 07</span>
  </header>

  <h1>The pointer is a <em>material</em>, not an arrow.</h1>

  <div class="actions">
    <a class="button" href="#contact" data-magnetic>Start a project <span aria-hidden="true">↗</span></a>
    <a class="button" href="#work" data-magnetic>See the work <span aria-hidden="true">→</span></a>
  </div>

  <div class="grid">
    <a class="tile" href="#ponder" data-tone="a" data-tilt data-cursor="View">
      <div class="tile-inner">
        <span class="label">Identity</span>
        <span class="name">Ponder AI</span>
      </div>
      <span class="glyph" aria-hidden="true">01</span>
    </a>
    <a class="tile" href="#cantor" data-tone="b" data-tilt data-cursor="View">
      <div class="tile-inner">
        <span class="label">Interface</span>
        <span class="name">Cantor8</span>
      </div>
      <span class="glyph" aria-hidden="true">02</span>
    </a>
    <a class="tile" href="#goom" data-tone="c" data-tilt data-cursor="View">
      <div class="tile-inner">
        <span class="label">Motion</span>
        <span class="name">Goom Gum</span>
      </div>
      <span class="glyph" aria-hidden="true">03</span>
    </a>
    <a class="tile" href="#oxi" data-tone="d" data-tilt data-cursor="View">
      <div class="tile-inner">
        <span class="label">Product</span>
        <span class="name">OXI</span>
      </div>
      <span class="glyph" aria-hidden="true">04</span>
    </a>
  </div>

  <footer>
    <span class="label">fine pointer only — touch keeps the native cursor</span>
    <span class="label" data-state>cursor active</span>
  </footer>
</div>

<div class="cursor-dot" data-cursor-dot aria-hidden="true"></div>
<div class="cursor-ring" data-cursor-ring aria-hidden="true"><span data-cursor-label>View</span></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
<script>
(function () {
  'use strict';
  if (window.__ewmMagneticCursor === 1) return;
  window.__ewmMagneticCursor = 1;

  var GATE = '(hover: hover) and (pointer: fine)';
  var REDUCE = '(prefers-reduced-motion: reduce)';
  var MAGNET_RATIO = 0.28;
  var MAGNET_MAX = 18;
  var TILT_RATIO = 0.05;
  var TILT_MAX = 10;

  var html = document.documentElement;
  var dot = document.querySelector('[data-cursor-dot]');
  var ring = document.querySelector('[data-cursor-ring]');
  var label = document.querySelector('[data-cursor-label]');
  var stateEl = document.querySelector('[data-state]');
  var magnetics = Array.prototype.slice.call(document.querySelectorAll('[data-magnetic]'));
  var tilts = Array.prototype.slice.call(document.querySelectorAll('[data-tilt]'));

  var enabled = false;
  var pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  var setDotX, setDotY, setRingX, setRingY;
  var rects = new WeakMap();

  function build() {
    setDotX = gsap.quickTo(dot, 'x', { duration: 0.12, ease: 'power3' });
    setDotY = gsap.quickTo(dot, 'y', { duration: 0.12, ease: 'power3' });
    setRingX = gsap.quickTo(ring, 'x', { duration: 0.4, ease: 'power3' });
    setRingY = gsap.quickTo(ring, 'y', { duration: 0.4, ease: 'power3' });
  }

  function cacheRect(el) {
    rects.set(el, el.getBoundingClientRect());
  }

  function invalidate() {
    rects = new WeakMap();
  }

  function onMove(e) {
    if (!enabled) return;
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    setDotX(e.clientX);
    setDotY(e.clientY);
    setRingX(e.clientX);
    setRingY(e.clientY);

    magnetics.forEach(function (el) {
      var r = rects.get(el) || (cacheRect(el), rects.get(el));
      var cx = r.left + r.width / 2;
      var cy = r.top + r.height / 2;
      var dx = (e.clientX - cx) * MAGNET_RATIO;
      var dy = (e.clientY - cy) * MAGNET_RATIO;
      var dist = Math.hypot(dx, dy);
      if (dist > MAGNET_MAX) { dx = (dx / dist) * MAGNET_MAX; dy = (dy / dist) * MAGNET_MAX; }
      gsap.to(el, { x: dx, y: dy, duration: 0.4, ease: 'expo.out', overwrite: 'auto' });
    });
  }

  function bindTargets() {
    tilts.forEach(function (el) {
      var inner = el.querySelector('.tile-inner') || el;
      el.addEventListener('pointerenter', function () {
        if (!enabled) return;
        cacheRect(el);
        var text = el.dataset.cursor;
        if (text) label.textContent = text;
        html.classList.add('is-over-target');
        gsap.to(ring, { scale: 2.2, borderColor: 'rgba(215,255,62,.85)', duration: 0.3, ease: 'expo.out' });
        gsap.to(inner, { scale: 1.06, duration: 0.6, ease: 'expo.out' });
      });
      el.addEventListener('pointermove', function (e) {
        if (!enabled) return;
        var r = rects.get(el) || el.getBoundingClientRect();
        var dx = ((e.clientX - (r.left + r.width / 2)) / r.width) * TILT_MAX * 2;
        var dy = ((e.clientY - (r.top + r.height / 2)) / r.height) * TILT_MAX * 2;
        gsap.to(inner, {
          x: Math.max(-TILT_MAX, Math.min(TILT_MAX, dx)),
          y: Math.max(-TILT_MAX, Math.min(TILT_MAX, dy)),
          duration: 0.6,
          ease: 'expo.out',
          overwrite: 'auto'
        });
      });
      el.addEventListener('pointerleave', function () {
        if (!enabled) return;
        html.classList.remove('is-over-target');
        gsap.to(ring, { scale: 1, borderColor: 'rgba(215,255,62,.5)', duration: 0.3, ease: 'expo.out' });
        gsap.to(inner, { scale: 1, x: 0, y: 0, duration: 0.6, ease: 'expo.out', overwrite: 'auto' });
      });
    });

    magnetics.forEach(function (el) {
      el.addEventListener('pointerenter', function () {
        if (!enabled) return;
        cacheRect(el);
        html.classList.add('is-over-target');
        gsap.to(ring, { scale: 1.8, duration: 0.3, ease: 'expo.out' });
      });
      el.addEventListener('pointerleave', function () {
        if (!enabled) return;
        html.classList.remove('is-over-target');
        gsap.to(ring, { scale: 1, duration: 0.3, ease: 'expo.out' });
        gsap.to(el, { x: 0, y: 0, duration: 0.4, ease: 'expo.out', overwrite: 'auto' });
      });
    });
  }

  function onDown() { if (enabled) gsap.to(dot, { scale: 0.4, duration: 0.15 }); }
  function onUp() { if (enabled) gsap.to(dot, { scale: 1, duration: 0.2 }); }

  function enable() {
    if (enabled) return;
    enabled = true;
    build();
    html.classList.add('has-cursor');
    gsap.set([dot, ring], { x: pointer.x, y: pointer.y });
    window.addEventListener('pointermove', onMove, { passive: true });
    window.addEventListener('pointerdown', onDown, { passive: true });
    window.addEventListener('pointerup', onUp, { passive: true });
    window.addEventListener('scroll', invalidate, { passive: true });
    window.addEventListener('resize', invalidate, { passive: true });
    stateEl.textContent = 'cursor active';
  }

  function disable() {
    if (!enabled) return;
    enabled = false;
    html.classList.remove('has-cursor', 'is-over-target');
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerdown', onDown);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('scroll', invalidate);
    window.removeEventListener('resize', invalidate);
    gsap.killTweensOf([dot, ring].concat(tilts.map(function (t) {
      return t.querySelector('.tile-inner') || t;
    })));
    gsap.set([dot, ring], { clearProps: 'all' });
    tilts.forEach(function (el) {
      var inner = el.querySelector('.tile-inner') || el;
      inner.style.transform = 'none';
    });
    magnetics.forEach(function (el) { el.style.transform = 'none'; });
    stateEl.textContent = 'native cursor';
  }

  bindTargets();

  var gateMq = window.matchMedia(GATE);
  var reduceMq = window.matchMedia(REDUCE);

  function apply() {
    if (gateMq.matches && !reduceMq.matches) enable();
    else disable();
  }

  apply();
  gateMq.addEventListener('change', apply);
  reduceMq.addEventListener('change', apply);
})();
</script>
</body>
</html>
